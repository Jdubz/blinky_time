# Pin bumps for the firmware/ and corpus/ submodules (#357). Each bump is a PR, so CI runs
# the firmware tools and the Python <-> firmware parity check against the new pin, and the
# Claude review runs on it (its token is a Dependabot secret here). .gitmodules names the
# branch each one follows: blinky-firmware master (hardware-tested), blinky-corpus main.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    # Dependabot otherwise applies its own cooldown and skips commits younger than
    # it (its first run here found nothing newer to offer). A day keeps a pin close.
    cooldown:
      default-days: 1
    commit-message:
      prefix: "submodules"
