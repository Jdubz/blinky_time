# Copy the review token to the repos and Dependabot scopes that need it (blinky_time#357).
# GitHub secrets can't be read back, so this job reads the token, seals it to each TARGET's
# secrets public key (libsodium sealed box: only GitHub can open it) and uploads the sealed
# values as an artifact. The operator then PUTs each through the API. No plaintext is printed
# or stored outside the runner.
#
# The targets are pinned here, not taken as inputs: a dispatcher-supplied key would let anyone
# who can dispatch workflows seal a secret to themselves (#358 review). They are public values,
# from `gh api repos/Jdubz/<repo>/{actions,dependabot}/secrets/public-key`. Changing them is a
# reviewed PR to master.
#
# Done so far: blinky-firmware's signing key (environment release-signing, checked against
# OtaKeys.h before it was sealed), CLAUDE_CODE_OAUTH_TOKEN and ANTHROPIC_API_KEY (#358).
# Delete this workflow once blinky-firmware has signed a release with the copied key.
name: Transfer secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-token:
    name: Seal the review token
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install pynacl
    - name: Seal
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      run: |
        python - <<'PY'
        import base64, json, os
        from nacl import encoding, public
        # (target, scope, key_id, public key)
        TARGETS = [
            ("Jdubz/blinky-corpus", "actions", "3380204578043523366",
             "bxEwr67n5mU3IXJYubAUDE+N6pp0UtABF3cofocN4To="),
            ("Jdubz/blinky_time", "dependabot", "3380217566468950943",
             "tM2GJ2qKrHyDtKbVWybbhkq1HZ4EBoHOIXifTDthN14="),
            ("Jdubz/blinky-firmware", "dependabot", "3380217566468950943",
             "ylkcU869NYbeKGz1exQjMuVm6j7DZPsrRgINL+AM83M="),
        ]
        v = os.environ.get("CLAUDE_CODE_OAUTH_TOKEN", "")
        if not v:
            raise SystemExit("CLAUDE_CODE_OAUTH_TOKEN is empty here; not transferring")
        out = []
        for repo, scope, key_id, key in TARGETS:
            box = public.SealedBox(public.PublicKey(key, encoding.Base64Encoder()))
            out.append({"repo": repo, "scope": scope, "name": "CLAUDE_CODE_OAUTH_TOKEN",
                        "key_id": key_id,
                        "encrypted_value": base64.b64encode(box.encrypt(v.encode())).decode()})
        json.dump(out, open("sealed.json", "w"))
        print("sealed for:", ", ".join(f"{t['repo']} ({t['scope']})" for t in out))
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: sealed-review-token
        path: sealed.json
        if-no-files-found: error
        retention-days: 1
