# One-time: copy secrets to blinky-firmware (blinky_time#357). GitHub secrets can't be read
# back, so this job reads each one, seals it to the TARGET's secrets public key (libsodium
# sealed box: only GitHub can open it) and uploads the sealed value as an artifact. The
# operator then PUTs it through the API. No plaintext is printed or stored outside the runner.
#
# The public keys and key ids come in as inputs (fetch them with
#   gh api repos/Jdubz/blinky-firmware/environments/release-signing/secrets/public-key
#   gh api repos/Jdubz/blinky-firmware/actions/secrets/public-key):
# this repo's token can't read another repo's. Delete this workflow once the copy is done.
name: Transfer secrets to blinky-firmware

on:
  workflow_dispatch:
    inputs:
      env_key:
        description: "blinky-firmware release-signing environment public key (base64)"
        required: true
      env_key_id:
        description: "its key_id"
        required: true
      repo_key:
        description: "blinky-firmware repository public key (base64)"
        required: true
      repo_key_id:
        description: "its key_id"
        required: true
      backup_age_recipient:
        description: "optional: an age public key (age1...) to encrypt an offline backup of the signing key to"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  signing-key:
    name: Seal the release signing key
    runs-on: ubuntu-latest
    environment: release-signing   # master only: the key is this environment's secret
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install pynacl cryptography
    - name: Check the key is the one the firmware trusts, then seal it
      env:
        KEY: ${{ secrets.BLINKY_RELEASE_SIGNING_KEY }}
        TARGET_KEY: ${{ inputs.env_key }}
        TARGET_KEY_ID: ${{ inputs.env_key_id }}
      run: |
        python - <<'PY'
        import base64, json, os, re
        from cryptography.hazmat.primitives import serialization
        from nacl import encoding, public
        key = os.environ["KEY"]
        if not key.strip():
            raise SystemExit("BLINKY_RELEASE_SIGNING_KEY is empty in this environment")
        pk = serialization.load_pem_private_key(key.encode(), password=None).public_key()
        raw = pk.public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw).hex()
        text = open("blinky-things/ota/OtaKeys.h").read()
        want = re.search(r"#else\s*\n// ([0-9a-f]{64})\n", text).group(1)
        if raw != want:
            raise SystemExit("the secret's public half is not the release key in OtaKeys.h; not transferring")
        print("signing key matches OtaKeys.h's release key")
        box = public.SealedBox(public.PublicKey(os.environ["TARGET_KEY"], encoding.Base64Encoder()))
        sealed = base64.b64encode(box.encrypt(key.encode())).decode()
        json.dump({"BLINKY_RELEASE_SIGNING_KEY": {"key_id": os.environ["TARGET_KEY_ID"], "encrypted_value": sealed}},
                  open("sealed-env.json", "w"))
        PY
    - name: Offline backup (age), if a recipient was given
      if: inputs.backup_age_recipient != ''
      env:
        KEY: ${{ secrets.BLINKY_RELEASE_SIGNING_KEY }}
        RECIPIENT: ${{ inputs.backup_age_recipient }}
      run: |
        sudo apt-get install -y -q age >/dev/null
        printf '%s' "$KEY" | age -r "$RECIPIENT" -a > release-signing-key.pem.age
        echo "backup written (age, armored)"
    - uses: actions/upload-artifact@v4
      with:
        name: sealed-signing-key
        path: |
          sealed-env.json
          release-signing-key.pem.age
        if-no-files-found: ignore
        retention-days: 1

  repo-secrets:
    name: Seal the review and API tokens
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install pynacl
    - name: Seal
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        TARGET_KEY: ${{ inputs.repo_key }}
        TARGET_KEY_ID: ${{ inputs.repo_key_id }}
      run: |
        python - <<'PY'
        import base64, json, os
        from nacl import encoding, public
        box = public.SealedBox(public.PublicKey(os.environ["TARGET_KEY"], encoding.Base64Encoder()))
        out = {}
        for name in ("CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY"):
            v = os.environ.get(name, "")
            if not v:
                raise SystemExit(f"{name} is empty here; not transferring")
            out[name] = {"key_id": os.environ["TARGET_KEY_ID"],
                         "encrypted_value": base64.b64encode(box.encrypt(v.encode())).decode()}
        json.dump(out, open("sealed-repo.json", "w"))
        print("sealed:", ", ".join(out))
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: sealed-repo-secrets
        path: sealed-repo.json
        retention-days: 1
