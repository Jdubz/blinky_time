name: PR Validation

on:
  pull_request:
    branches: [ master, main ]
  # Also validate master itself: two PRs that each pass alone can still break
  # together once both are merged.
  push:
    branches: [ master ]

jobs:
  compile:
    name: Compile Firmware
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      with:
        version: 1.3.1   # = tools/firmware_toolchain.json arduino_cli

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # The pinned, isolated toolchain (scripts/setup_toolchain.sh, #252), the
    # same one release builds and every workstation use, so this check
    # compiles exactly what devices run.
    - name: Install pinned toolchain
      run: |
        pip install adafruit-nrfutil
        bash scripts/setup_toolchain.sh

    - name: Compile sketch (scripts/build.sh, as releases do)
      run: bash scripts/build.sh --build 0

  cppcheck:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Pinned: Ubuntu's apt cppcheck (2.13 on 24.04) misses findings that 2.16
    # reports, so CI passed code that failed locally (#201). Built from source
    # once and cached by version.
    - name: Cache cppcheck
      id: cppcheck-cache
      uses: actions/cache@v4
      with:
        path: ~/cppcheck
        key: cppcheck-2.16.0-${{ runner.os }}

    - name: Build cppcheck 2.16.0
      if: steps.cppcheck-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch 2.16.0 https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
        cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-build -DCMAKE_BUILD_TYPE=Release           -DUSE_MATCHCOMPILER=ON -DCMAKE_INSTALL_PREFIX=$HOME/cppcheck
        cmake --build /tmp/cppcheck-build -j"$(nproc)"
        cmake --install /tmp/cppcheck-build

    - name: Run cppcheck
      run: |
        export PATH="$HOME/cppcheck/bin:$PATH"
        cppcheck --version | grep -qx 'Cppcheck 2.16.0' || { cppcheck --version; echo "wrong cppcheck version"; exit 1; }
        cppcheck \
          --enable=warning,style,performance,portability \
          --error-exitcode=1 \
          --suppressions-list=.cppcheck-suppressions \
          --inline-suppr \
          -I blinky-things/ \
          --std=c++14 \
          --platform=native \
          --quiet \
          blinky-things/

  ota-manifest:
    name: OTA Manifest (firmware verifier vs release signer)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Vectors are current
      run: |
        pip install cryptography
        python tools/ota_manifest.py vectors --out /tmp/vectors.h
        diff -u tests/ota/vectors.h /tmp/vectors.h || {
          echo "::error::tests/ota/vectors.h is stale: run python tools/ota_manifest.py vectors --out tests/ota/vectors.h"; exit 1; }

    - name: Build and run (firmware's own Monocypher units, -std=gnu++11 like the core)
      run: |
        mkdir -p build
        gcc -c -O1 -Wall -I blinky-things blinky-things/OtaMonocypher.c -o build/mc.o
        gcc -c -O1 -Wall -I blinky-things blinky-things/OtaMonocypherEd25519.c -o build/mc_ed.o
        g++ -std=gnu++11 -Wall -Wextra -Werror -O1 -I blinky-things -I tests/ota           tests/ota/ota_manifest_test.cpp build/mc.o build/mc_ed.o -o build/ota_manifest_test
        build/ota_manifest_test

  timing:
    name: Absolute Timing (generators + rhythm phase, #259-#261)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # A 2 s frame must land where 2 s of frames would (no stretched
    # animation); the rhythm phase extrapolation is capped and monotonic.
    # UBSan: a long frame must not overflow the physics either.
    - name: Build and run (UBSan)
      run: |
        mkdir -p build
        g++ -std=c++17 -Wall -Wextra -O1 -g -fsanitize=undefined,float-cast-overflow,float-divide-by-zero           -fno-sanitize-recover=all -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840           -I blinky-simulator/include -I blinky-things tests/timing/timing_test.cpp           blinky-things/types/PixelMatrix.cpp blinky-things/types/BlinkyAssert.cpp           blinky-things/physics/PhysicsContext.cpp blinky-things/particles/Particle.cpp           blinky-things/math/SimplexNoise.cpp blinky-things/generators/Fire.cpp           blinky-things/generators/Water.cpp blinky-things/generators/PlasmaGlobe.cpp           blinky-things/generators/Audio.cpp -o build/timing_test
        build/timing_test

  static-init-safety:
    name: Static Init Safety Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for dangerous static initialization
      run: |
        echo "Checking for static initialization order fiasco patterns..."
        echo "These patterns can brick devices by crashing before setup() runs."
        echo ""
        python scripts/check_static_init.py blinky-things/

  syntax-validation:
    name: Syntax Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run syntax validation
      run: |
        python tools/validate_syntax.py blinky-things/

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check include guards
      run: |
        echo "Checking include guards..."
        missing_guards=""
        for file in $(find blinky-things/ -name "*.h" -type f); do
          if ! grep -q "#pragma once" "$file" && ! grep -q "#ifndef.*_H" "$file"; then
            missing_guards="$missing_guards\n  - $file"
          fi
        done
        if [ -n "$missing_guards" ]; then
          echo "❌ Missing include guards in:$missing_guards"
          exit 1
        fi
        echo "✅ All header files have include guards"

    - name: Check for debug code
      run: |
        echo "Checking for leftover debug code..."
        # These are warnings, not failures
        if grep -rn "TODO\|FIXME\|HACK\|XXX" blinky-things/ --include="*.cpp" --include="*.h" --include="*.ino" 2>/dev/null; then
          echo "⚠️  Found TODO/FIXME comments (not blocking)"
        else
          echo "✅ No TODO/FIXME comments found"
        fi

    - name: Check for large files
      run: |
        echo "Checking for overly large source files..."
        large_files=""
        for file in $(find blinky-things/ -name "*.cpp" -o -name "*.h" -o -name "*.ino" | head -100); do
          lines=$(wc -l < "$file")
          if [ "$lines" -gt 1000 ]; then
            large_files="$large_files\n  - $file ($lines lines)"
          fi
        done
        if [ -n "$large_files" ]; then
          echo "⚠️  Large files found (consider splitting):$large_files"
        else
          echo "✅ No overly large files"
        fi

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check required files
      run: |
        echo "Checking documentation completeness..."
        missing=""
        for file in README.md LICENSE CONTRIBUTING.md; do
          if [ ! -f "$file" ]; then
            missing="$missing $file"
          fi
        done
        if [ -n "$missing" ]; then
          echo "❌ Missing required files:$missing"
          exit 1
        fi
        echo "✅ All required documentation files present"

    - name: Check version file
      run: |
        if [ -f "VERSION" ]; then
          echo "✅ VERSION file exists: $(cat VERSION)"
        else
          echo "⚠️  VERSION file not found"
        fi

  blinky-server-tests:
    name: Blinky Server Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blinky-server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m venv venv
        venv/bin/pip install -e ".[dev,ble]"

    - name: Run linting
      run: venv/bin/python -m ruff check blinky_server/ tests/

    - name: Check formatting
      run: venv/bin/python -m ruff format --check blinky_server/ tests/

    - name: Run type checking
      run: venv/bin/python -m mypy blinky_server/

    - name: Run tests
      run: venv/bin/python -m pytest tests/ -v

  feature-parity:
    name: Feature Parity (Python ↔ firmware)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install numpy for unit tests
      run: pip install 'numpy>=1.26,<3' scipy pyyaml

    - name: Run Python shape-feature unit tests
      # Regression guard for bin-indexing (centroid/HFC k=1..N) and the
      # resolve_hybrid_features config parser. Runs offline — no audio
      # files or harness build required. The firmware-parity side is
      # verified locally via ml-training/analysis/run_parity_test.py.
      working-directory: ml-training
      run: python -m analysis.test_shape_features

    - name: Mel parity (training front end vs firmware, #295)
      # The NN runs on the firmware's integer MEL_BANDS table, not an HTK
      # filterbank. Builds tests/parity (the real SharedSpectralAnalysis.cpp)
      # and checks: the spec carries the firmware's table and constants; the
      # firmware still produces the golden frames; training's front end
      # (scripts/mel_frontend.py) reproduces them; configs default to the table.
      run: |
        cmake -S tests/parity -B tests/parity/build -DCMAKE_BUILD_TYPE=Release
        cmake --build tests/parity/build -j
        cd ml-training
        python -m analysis.test_mel_parity --harness ../tests/parity/build/parity_harness

    - name: Run ML storage-root, Spark client and drum-label sync tests
      # No config may hardcode a machine's mounts (#286): data and work roots
      # come from BLINKY_DATA / BLINKY_WORK. The Spark CLI (#288) is a thin
      # client of blinky-server's /api/spark routes; the client itself is
      # tested with the server (blinky-server/tests/test_spark.py).
      # blinky-server's drum scoring cleans kick_weighted labels with its own
      # copy of clean_kick_weighted.py's rule (#294); the two must agree.
      working-directory: ml-training
      run: |
        pip install pytest
        python -m pytest -q tests/test_storage_roots.py tests/test_spark_jobs.py \
          tests/test_drum_label_sync.py tests/test_supervision.py

  trainer-contract:
    name: Trainer meets the Spark gpu_task contract (#304)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CPU torch
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install 'numpy>=1.26,<3' scipy pyyaml pytest

    - name: SIGTERM -> exit 42 -> resume -> finish; a changed run refuses the checkpoint
      # The real train.py on a tiny synthetic dataset, with the environment the Spark's
      # gpu_task worker sets (SPARK_INPUT_DATA, SPARK_OUTPUT_MODEL, SPARK_CHECKPOINT_DIR).
      working-directory: ml-training
      run: python -m pytest -v tests/test_trainer_supervision.py

  blinky-console-tests:
    name: Blinky Console Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blinky-console

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Check formatting
      run: npm run format:check

    - name: Run type check
      run: npm run typecheck

    - name: Run tests
      run: npx vitest run

    - name: Build
      run: npm run build

  tracker-harness:
    name: Tracker Harness (UBSan stress + corpus gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install numpy imageio-ffmpeg

    - name: Build harness (UBSan and release)
      run: |
        mkdir -p build
        SRCS="tests/tracker/tracker_harness.cpp blinky-things/audio/AudioTracker.cpp \
          blinky-things/audio/SharedSpectralAnalysis.cpp blinky-things/inputs/AdaptiveMic.cpp \
          blinky-things/types/BlinkyAssert.cpp"
        FLAGS="-std=c++17 -DBLINKY_HOST_HARNESS -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 \
          -Iblinky-simulator/include -Iblinky-things"
        # GCC's -fsanitize=undefined omits the float checks; the tracker casts
        # floats to int (lags, pattern bins), so add them explicitly.
        g++ $FLAGS -O1 -g -fsanitize=undefined,float-cast-overflow,float-divide-by-zero \
          -fno-sanitize-recover=all $SRCS -o build/tracker_harness_ubsan
        g++ $FLAGS -O2 $SRCS -o build/tracker_harness

    - name: UBSan stress (silence, gap, clip, noise, hum, clicks at 15/60/250 fps)
      run: python tests/tracker/run_stress.py --harness build/tracker_harness_ubsan

    # CPU cost model calibrated to hat_v1 (tests/tracker/README.md). The
    # device build (NN off) must leave the renderer its frame rate: 177 fps
    # simulated, matching the hat's measured 179 fps.
    - name: Frame-rate gate (device build, hat CPU cost model)
      run: |
        head -c $((16000*2*20)) /dev/urandom > /tmp/noise.pcm
        build/tracker_harness /tmp/noise.pcm /tmp/out.csv 60 0.25 1 --nn-cost-us=12000 --frame-cost-us=3200 --render-cost-us=4500 2> /tmp/cost.log
        cat /tmp/cost.log
        fps=$(grep -o ' fps=[0-9.]*' /tmp/cost.log | cut -d= -f2)
        if [ -z "$fps" ] || awk "BEGIN{exit !($fps < 150)}"; then
          echo "::error title=Frame rate::simulated device fps '$fps' < 150: audio work is starving the renderer"
          exit 1
        fi

    # The corpus plays at the device's level (run_tracker_eval.py --level-db,
    # default -50 dB re the mastered file, int16): hat_v1's mic peaks at
    # ~0.003 FS with music, and file-level testing hid a detector that fired
    # nothing on the device (#280). Floors sit just under the device-level
    # baseline on edm/ at 35/60/90 fps: excess 0.081, tempo 0.678, recall
    # 0.642. Tempo was 0.726 at file level with the same tracker: the rhythm
    # path (bass flux of compressed linear magnitudes) is level-sensitive,
    # an open issue the file-level gate never saw. Recall is against ALL
    # strong consensus onsets (hats included), a secondary number: the
    # detector targets kicks and snares (CLAUDE.md); at device level the old
    # picker scored 0.374. Raise the floors as the tracker improves.
    #
    # The drum floors are the PRIMARY gate (#294): kick recall at +-50 ms,
    # on-drum share and drum F against cleaned kick_weighted labels
    # (blinky_server/testing/drum_scoring.py). Baseline on master (SuperFlux,
    # 2026-10-27), means over 35/60/90 fps: kick R 0.789, on-drum 0.583,
    # drum F 0.638 (the #292 study: 0.79 / 0.56 / 0.657). Snare recall (0.727)
    # is reported but not gated: provisional until the label fixes in #284.
    - name: Corpus regression gate (edm/, 35/60/90 fps)
      run: |
        python tests/tracker/run_tracker_eval.py --harness build/tracker_harness \
          --min-excess 0.07 --min-tempo 0.66 --min-recall 0.61 \
          --min-kick-recall 0.77 --min-on-drum 0.56 --min-drum-f 0.62

  model-input-check:
    name: Onset Model Input Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tflite schema parser
      run: pip install tflite==2.18.0

    # Mirrors FrameOnsetNN::begin()'s static checks on the embedded model so a
    # model the firmware would refuse fails the PR instead of silently running
    # devices without the onset NN (the 80-mel v36 export did that, initError 5).
    - name: Check embedded model against the firmware's limits
      run: python tools/check_model_input.py

  tracker-harness-nn:
    name: Tracker Harness with real onset NN (host TFLite Micro)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      with:
        version: 1.3.1   # = tools/firmware_toolchain.json arduino_cli

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install numpy imageio-ffmpeg

    - name: Install TFLite Micro library
      run: |
        arduino-cli config init
        bash tools/setup_tflite_lib.sh --ci

    # Builds TFLite Micro for the host and links the harness with
    # BLINKY_HOST_NN, so FrameOnsetNN runs the embedded model (#203).
    - name: Build harness with the real onset NN
      run: bash tests/tracker/build_host_nn.sh --out build/host_nn

    - name: Stress run with the NN path
      run: python tests/tracker/run_stress.py --harness build/host_nn/tracker_harness_nn

    # The embedded model must initialize: a refused model (e.g. the 80-mel
    # v36 export, initError 5) silently runs every device on the fallback
    # ODF. model-input-check catches width mismatches statically; this
    # catches everything else (ops, arena, quantization) on the real
    # interpreter.
    - name: Embedded model must initialize
      run: |
        head -c $((16000*2*20)) /dev/urandom > /tmp/noise.pcm
        # The NN harness exits 5 when the model is refused, so this doesn't
        # depend on the wording of the firmware's log line.
        rc=0; build/host_nn/tracker_harness_nn /tmp/noise.pcm /tmp/out.csv 60 > /tmp/nn.log 2>&1 || rc=$?
        if [ "$rc" -ne 0 ]; then
          cat /tmp/nn.log
          echo "::error title=Onset NN::NN harness exited $rc - the embedded model is refused (5) or the run failed"
          exit 1
        fi
        echo "Embedded onset model initializes on the host."

    # Livelock guard: with the NN on, update() must run at most one inference
    # per call and must not chase samples that arrive during it. b208-b210
    # did, and the hat fell to 12 fps (simulated 11.5; fixed loop 48.7).
    - name: Frame-rate gate with the NN (hat CPU cost model)
      run: |
        build/host_nn/tracker_harness_nn /tmp/noise.pcm /tmp/out.csv 60 0.25 1 --nn-cost-us=12000 --frame-cost-us=3200 --render-cost-us=4500 2> /tmp/cost.log
        cat /tmp/cost.log
        fps=$(grep -o ' fps=[0-9.]*' /tmp/cost.log | cut -d= -f2)
        if [ -z "$fps" ] || awk "BEGIN{exit !($fps < 35)}"; then
          echo "::error title=Frame rate::simulated fps with the NN '$fps' < 35: the drain loop is running the NN on every frame (livelock)"
          exit 1
        fi

    # Devices ship with the NN off (BLINKY_ONSET_NN_ENABLED=0), but the NN
    # path must stay correct for the day a model beats flux: same tempo /
    # phase floors as the device gate (#155: the NN as a tempo source dropped
    # corpus tempo 0.726 -> 0.621 unnoticed).
    - name: Corpus regression gate with the NN (edm/, 35/60/90 fps)
      run: |
        python tests/tracker/run_tracker_eval.py --harness build/host_nn/tracker_harness_nn           --min-excess 0.07 --min-tempo 0.66 --min-recall 0.25
