name: PR Validation

on:
  pull_request:
    branches: [ master, staging ]
  # Also validate master and staging themselves: two PRs that each pass alone
  # can still break together once both are merged. A green run on a staging
  # push starts the staging firmware build (staging-build.yml).
  push:
    branches: [ master, staging ]

jobs:
  compile:
    name: Compile Firmware
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2
      with:
        version: 1.3.1   # = tools/firmware_toolchain.json arduino_cli

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # The pinned, isolated toolchain (scripts/setup_toolchain.sh, #252), the
    # same one release builds and every workstation use, so this check
    # compiles exactly what devices run.
    - name: Install pinned toolchain
      run: |
        pip install adafruit-nrfutil
        bash scripts/setup_toolchain.sh

    - name: Compile sketch (scripts/build.sh, as releases do)
      run: bash scripts/build.sh --build 0

  cppcheck:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Pinned: Ubuntu's apt cppcheck (2.13 on 24.04) misses findings that 2.16
    # reports, so CI passed code that failed locally (#201). Built from source
    # once and cached by version.
    - name: Cache cppcheck
      id: cppcheck-cache
      uses: actions/cache@v4
      with:
        path: ~/cppcheck
        key: cppcheck-2.16.0-${{ runner.os }}

    - name: Build cppcheck 2.16.0
      if: steps.cppcheck-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch 2.16.0 https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
        cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-build -DCMAKE_BUILD_TYPE=Release           -DUSE_MATCHCOMPILER=ON -DCMAKE_INSTALL_PREFIX=$HOME/cppcheck
        cmake --build /tmp/cppcheck-build -j"$(nproc)"
        cmake --install /tmp/cppcheck-build

    - name: Run cppcheck
      run: |
        export PATH="$HOME/cppcheck/bin:$PATH"
        cppcheck --version | grep -qx 'Cppcheck 2.16.0' || { cppcheck --version; echo "wrong cppcheck version"; exit 1; }
        cppcheck \
          --enable=warning,style,performance,portability \
          --error-exitcode=1 \
          --suppressions-list=.cppcheck-suppressions \
          --inline-suppr \
          -I blinky-things/ \
          --std=c++14 \
          --platform=native \
          --quiet \
          blinky-things/

  ota-manifest:
    name: OTA Manifest (firmware verifier vs release signer)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Vectors are current
      run: |
        pip install cryptography
        python tools/ota_manifest.py vectors --out /tmp/vectors.h
        diff -u tests/ota/vectors.h /tmp/vectors.h || {
          echo "::error::tests/ota/vectors.h is stale: run python tools/ota_manifest.py vectors --out tests/ota/vectors.h"; exit 1; }

    - name: Build and run (firmware's own Monocypher units, -std=gnu++11 like the core)
      run: |
        mkdir -p build
        gcc -c -O1 -Wall -I blinky-things blinky-things/OtaMonocypher.c -o build/mc.o
        gcc -c -O1 -Wall -I blinky-things blinky-things/OtaMonocypherEd25519.c -o build/mc_ed.o
        g++ -std=gnu++11 -Wall -Wextra -Werror -O1 -I blinky-things -I tests/ota           tests/ota/ota_manifest_test.cpp build/mc.o build/mc_ed.o -o build/ota_manifest_test
        build/ota_manifest_test

  timing:
    name: Absolute Timing (generators + rhythm phase, #259-#261)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # A 2 s frame must land where 2 s of frames would (no stretched
    # animation); the rhythm phase extrapolation is capped and monotonic.
    # UBSan: a long frame must not overflow the physics either.
    - name: Build and run (UBSan)
      run: |
        mkdir -p build
        g++ -std=c++17 -Wall -Wextra -O1 -g -fsanitize=undefined,float-cast-overflow,float-divide-by-zero           -fno-sanitize-recover=all -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840           -I blinky-simulator/include -I blinky-things tests/timing/timing_test.cpp           blinky-things/types/PixelMatrix.cpp blinky-things/types/BlinkyAssert.cpp           blinky-things/physics/PhysicsContext.cpp blinky-things/particles/Particle.cpp           blinky-things/math/SimplexNoise.cpp blinky-things/generators/Fire.cpp           blinky-things/generators/Water.cpp blinky-things/generators/PlasmaGlobe.cpp           blinky-things/generators/Audio.cpp -o build/timing_test
        build/timing_test

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # The bench side of the same property: the release gate's beatpace check compares the
    # beats a device counts with its tempo integrated over wall-clock time (#258).
    - name: Release gate beat-pace arithmetic
      run: |
        pip install pytest pyserial
        python -m pytest -v tests/tools/test_release_gate.py tests/tools/test_staging_download.py

  static-init-safety:
    name: Static Init Safety Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for dangerous static initialization
      run: |
        echo "Checking for static initialization order fiasco patterns..."
        echo "These patterns can brick devices by crashing before setup() runs."
        echo ""
        python scripts/check_static_init.py blinky-things/

  syntax-validation:
    name: Syntax Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run syntax validation
      run: |
        python tools/validate_syntax.py blinky-things/

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check include guards
      run: |
        echo "Checking include guards..."
        missing_guards=""
        for file in $(find blinky-things/ -name "*.h" -type f); do
          if ! grep -q "#pragma once" "$file" && ! grep -q "#ifndef.*_H" "$file"; then
            missing_guards="$missing_guards\n  - $file"
          fi
        done
        if [ -n "$missing_guards" ]; then
          echo "❌ Missing include guards in:$missing_guards"
          exit 1
        fi
        echo "✅ All header files have include guards"

    - name: Check for debug code
      run: |
        echo "Checking for leftover debug code..."
        # These are warnings, not failures
        if grep -rn "TODO\|FIXME\|HACK\|XXX" blinky-things/ --include="*.cpp" --include="*.h" --include="*.ino" 2>/dev/null; then
          echo "⚠️  Found TODO/FIXME comments (not blocking)"
        else
          echo "✅ No TODO/FIXME comments found"
        fi

    - name: Check for large files
      run: |
        echo "Checking for overly large source files..."
        large_files=""
        for file in $(find blinky-things/ -name "*.cpp" -o -name "*.h" -o -name "*.ino" | head -100); do
          lines=$(wc -l < "$file")
          if [ "$lines" -gt 1000 ]; then
            large_files="$large_files\n  - $file ($lines lines)"
          fi
        done
        if [ -n "$large_files" ]; then
          echo "⚠️  Large files found (consider splitting):$large_files"
        else
          echo "✅ No overly large files"
        fi

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check required files
      run: |
        echo "Checking documentation completeness..."
        missing=""
        for file in README.md LICENSE CONTRIBUTING.md; do
          if [ ! -f "$file" ]; then
            missing="$missing $file"
          fi
        done
        if [ -n "$missing" ]; then
          echo "❌ Missing required files:$missing"
          exit 1
        fi
        echo "✅ All required documentation files present"

    - name: Check version file
      run: |
        if [ -f "VERSION" ]; then
          echo "✅ VERSION file exists: $(cat VERSION)"
        else
          echo "⚠️  VERSION file not found"
        fi

  blinky-server-tests:
    name: Blinky Server Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blinky-server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The server runs the firmware repo's tools/ and scores with the corpus's blinky_scoring
    # (#357); never the bootloader submodule.
    - name: Firmware and corpus submodules
      working-directory: .
      run: git submodule update --init --depth 1 firmware corpus

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m venv venv
        venv/bin/pip install -e ".[dev,ble]"

    - name: Run linting
      run: venv/bin/python -m ruff check blinky_server/ tests/

    - name: Check formatting
      run: venv/bin/python -m ruff format --check blinky_server/ tests/

    - name: Run type checking
      run: venv/bin/python -m mypy blinky_server/

    - name: Run tests
      run: venv/bin/python -m pytest tests/ -v

    - name: Test box deployer and staging runner (scripts/testbox/)
      # They decide what the test box runs and what reaches master (#349), so they are
      # tested like the server.
      run: |
        venv/bin/python -m ruff check --line-length 100 ../scripts/testbox/
        venv/bin/python -m ruff format --check --line-length 100 ../scripts/testbox/
        venv/bin/python -m mypy --strict --ignore-missing-imports \
          ../scripts/testbox/deploy.py ../scripts/testbox/staging.py
        venv/bin/python -m pytest -v ../scripts/testbox/test_deploy.py ../scripts/testbox/test_staging.py

  feature-parity:
    name: Feature Parity (Python ↔ firmware)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The edm labels and blinky_scoring, for test_drum_label_sync (#357).
    - name: Corpus submodule
      run: git submodule update --init --depth 1 corpus

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install numpy for unit tests
      run: pip install 'numpy>=1.26,<3' scipy pyyaml

    - name: Run Python shape-feature unit tests
      # Regression guard for bin-indexing (centroid/HFC k=1..N) and the
      # resolve_hybrid_features config parser. Runs offline — no audio
      # files or harness build required. The firmware-parity side is
      # verified locally via ml-training/analysis/run_parity_test.py.
      working-directory: ml-training
      run: python -m analysis.test_shape_features

    - name: Mel parity (training front end vs firmware, #295)
      # The NN runs on the firmware's integer MEL_BANDS table, not an HTK
      # filterbank. Builds tests/parity (the real SharedSpectralAnalysis.cpp)
      # and checks: the spec carries the firmware's table and constants; the
      # firmware still produces the golden frames; training's front end
      # (scripts/mel_frontend.py) reproduces them; configs default to the table.
      run: |
        cmake -S tests/parity -B tests/parity/build -DCMAKE_BUILD_TYPE=Release
        cmake --build tests/parity/build -j
        cd ml-training
        python -m analysis.test_mel_parity --harness ../tests/parity/build/parity_harness

    - name: Mel front end travels to the model header (#291)
      # prepare_dataset.py records the front end, train.py and export_tflite.py
      # carry it into the header, and FrameOnsetNN.h / check_model_input.py
      # refuse one the firmware doesn't run. The record and the header check.
      working-directory: ml-training
      run: |
        pip install pytest
        python -m pytest -q tests/test_mel_frontend_record.py

    - name: Run ML storage-root, Spark client and drum-label sync tests
      # No config may hardcode a machine's mounts (#286): data and work roots
      # come from BLINKY_DATA / BLINKY_WORK. The Spark CLI (#288) is a thin
      # client of blinky-server's /api/spark routes; the client itself is
      # tested with the server (blinky-server/tests/test_spark.py).
      # blinky-server's drum scoring cleans kick_weighted labels with its own
      # copy of clean_kick_weighted.py's rule (#294); the two must agree.
      working-directory: ml-training
      run: |
        pip install pytest
        python -m pytest -q tests/test_storage_roots.py tests/test_spark_jobs.py tests/test_prep_steps.py \
          tests/test_drum_label_sync.py tests/test_supervision.py

  trainer-contract:
    name: Trainer meets the Spark gpu_task contract (#304, #305)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CPU torch
      run: |
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install 'numpy>=1.26,<3' scipy pyyaml pytest librosa tqdm soundfile

    - name: SIGTERM -> exit 42 -> resume -> finish; a changed run refuses the checkpoint
      # The real train.py on a tiny synthetic dataset, with the environment the Spark's
      # gpu_task worker sets (SPARK_INPUT_DATA, SPARK_OUTPUT_MODEL, SPARK_CHECKPOINT_DIR).
      working-directory: ml-training
      run: python -m pytest -v tests/test_trainer_supervision.py

    - name: Shift-tolerant loss (#290)
      # Beat This!'s loss: firing within ±3 frames of a label is free, and no frame within ±6
      # of one is a negative.
      working-directory: ml-training
      run: python -m pytest -v tests/test_losses.py

    - name: spark_entry.py preps the corpus and trains; SIGTERM in prep exits 42
      # Real prepare_dataset.py (augmented: RIR + noise) then train.py, on an eight-track
      # synthetic corpus laid out like the store's datasets/blinky-corpus/, code read-only.
      working-directory: ml-training
      run: python -m pytest -v tests/test_spark_entry.py

    - name: Drum label regression suite and generator guards (#284)
      # The suite a kick/snare label generator must pass, its baseline, and the generator's
      # refusal to mix labels from two generators in one dir. ADTOF's own tests skip here:
      # they run in the adtof-labeler job.
      working-directory: ml-training
      run: python -m pytest -v tests/test_drum_label_suite.py

  adtof-labeler:
    name: ADTOF drum labeler (#284)
    # The labels' generator: ADTOF's Frame_RNN through the PyTorch port, pinned, as the Spark's
    # torch-cu130 runtime installs it (my-spark #1561). Its tests may not skip here, and the
    # committed evidence (drum_label_adtof.json) must be what it produces.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CPU torch and the port
      working-directory: ml-training
      run: |
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install 'numpy>=1.26,<3' scipy pyyaml pytest librosa tqdm soundfile pretty_midi
        pip install "$(python -c 'from scripts.adtof_labels import ADTOF_PYTORCH; print(ADTOF_PYTORCH)')"

    - name: ADTOF's tests (no skips)
      working-directory: ml-training
      env:
        BLINKY_REQUIRE_ADTOF: "1"
      run: python -m pytest -v tests/test_drum_label_suite.py -k adtof

    - name: The committed evidence is ADTOF's
      # Re-scores ADTOF on the synthetic set and edm/'s 18 mixes. A difference means
      # drum_label_adtof.json isn't what this generator produces: commit the uploaded file.
      working-directory: ml-training
      run: |
        python scripts/drum_label_suite.py candidate --algorithm adtof
        git diff --exit-code scripts/drum_label_adtof.json

    - name: Upload the regenerated evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: drum_label_adtof
        path: ml-training/scripts/drum_label_adtof.json

  blinky-console-tests:
    name: Blinky Console Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blinky-console

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Check formatting
      run: npm run format:check

    - name: Run type check
      run: npm run typecheck

    - name: Run tests
      run: npx vitest run

    - name: Build
      run: npm run build

  model-input-check:
    name: Onset Model Input Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tflite schema parser
      run: pip install tflite==2.18.0

    # Mirrors FrameOnsetNN::begin()'s static checks on the embedded model so a
    # model the firmware would refuse fails the PR instead of silently running
    # devices without the onset NN (the 80-mel v36 export did that, initError 5).
    - name: Check embedded model against the firmware's limits
      # Also its mel front end and the bytes' hash, as FrameOnsetNN.h does (#291).
      run: python tools/check_model_input.py
