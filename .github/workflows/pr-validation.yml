name: PR Validation

on:
  # Draft PRs run only the cheap checks (changed paths, docs); the heavy jobs (server, console,
  # ML trainer contract, ADTOF labeler, camera analysis, feature parity) wait until the PR is
  # ready for review: marking it ready (ready_for_review) starts a run with all of them
  # (docs/DEV_LOOP.md, section 4). A heavy job skipped on a draft reports "skipped", which a
  # required check accepts; GitHub never merges a draft, and the ready run's results replace
  # the skipped ones on the same head. Re-running a run made while the PR was a draft replays
  # its event and skips them again: mark the PR ready instead.
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Also validate master itself: two PRs that each pass alone can still break
  # together once both are merged. (blinky_time has no staging branch since the
  # repo split; firmware staging lives in blinky-firmware.)
  push:
    branches: [ master ]

jobs:
  # Which slow checks this change needs (owner, 2026-11-24: rapid iteration with sensible
  # validation; not every check runs for every change). The server, ML and console suites
  # run only when something they test changed. They stay required checks: a job skipped by
  # its own `if` reports success (and the box deployer counts skipped as green), while a
  # workflow-level path filter would leave a required check waiting forever.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      ml: ${{ steps.diff.outputs.ml }}
      console: ${{ steps.diff.outputs.console }}
      build_service: ${{ steps.diff.outputs.build_service }}
      labels_service: ${{ steps.diff.outputs.labels_service }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Diff against the base
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "$EVENT" = pull_request ]; then
          range="origin/$BASE_REF...HEAD"
        elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          range="$BEFORE..HEAD"
        else
          echo "no base to diff against: run everything"
          printf 'server=true\nml=true\nconsole=true\nbuild_service=true\nlabels_service=true\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # --no-renames: a move lists both paths, so moving a file out of a watched tree still
        # runs that tree's suite.
        git diff --name-only --no-renames "$range" > changed.txt
        echo "changed ($range):"; cat changed.txt
        # server: blinky-server (with its own host tools, hosttools/) and the test box scripts
        # its job also tests (not camera/, which has its own job), the device registry it lints
        # (devices/), and the corpus scorers it runs; ml: ml-training and the corpus it labels
        # and trains on; console: blinky-console; build_service: build-service/ and the package
        # verifier it shares with the server (hosttools/firmware_release.py). A change to this
        # workflow runs everything.
        check() {
          if grep -qE "$2" changed.txt; then v=true; else v=false; fi
          echo "$1=$v" >> "$GITHUB_OUTPUT"; echo "$1: $v"
        }
        check server '^(blinky-server/|scripts/testbox/[^/]+$|scripts/testbox/alloy/|devices/|corpus$|\.gitmodules$|\.github/workflows/pr-validation\.yml$)'
        check ml '^(ml-training/|corpus$|\.gitmodules$|\.github/workflows/pr-validation\.yml$)'
        check console '^(blinky-console/|\.github/workflows/pr-validation\.yml$)'
        check build_service '^(build-service/|blinky-server/hosttools/firmware_release\.py$|\.github/workflows/pr-validation\.yml$)'
        # labels_service: the labels service, the build host's deployments (labels and the build
        # service) and the pull deployer (which reuses scripts/testbox/deploy.py's gate).
        check labels_service '^(labels-service/|deploy/build-host/|scripts/testbox/deploy\.py$|\.github/workflows/pr-validation\.yml$)'

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Check required files
      run: |
        echo "Checking documentation completeness..."
        missing=""
        for file in README.md LICENSE CONTRIBUTING.md; do
          if [ ! -f "$file" ]; then
            missing="$missing $file"
          fi
        done
        if [ -n "$missing" ]; then
          echo "❌ Missing required files:$missing"
          exit 1
        fi
        echo "✅ All required documentation files present"

    - name: No network topology (the repo is public)
      # Host names, private/tailnet addresses and mDNS names belong in ~/.config/blinky/, never
      # here; justified exceptions go in .topology-allowlist.
      run: python3 scripts/check_topology.py

    - name: Check version file
      run: |
        if [ -f "VERSION" ]; then
          echo "✅ VERSION file exists: $(cat VERSION)"
        else
          echo "⚠️  VERSION file not found"
        fi

  blinky-server-tests:
    name: Blinky Server Tests
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`). Otherwise skipped unless server changed (job
    # `changes`); runs if that job failed, so a broken diff can never skip it silently.
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}

    defaults:
      run:
        working-directory: blinky-server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # The server scores with the corpus's blinky_scoring (#357). Its host tools are its own
    # (hosttools/, 2026-11-24 decoupling), so only the corpus.
    - name: Corpus submodule
      working-directory: .
      run: git submodule update --init --depth 1 corpus

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: ffmpeg (ffprobe reads track lengths, as on the box)
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

    - name: Install dependencies
      run: |
        python -m venv venv
        venv/bin/pip install -e ".[dev,ble]"

    - name: Run linting
      run: venv/bin/python -m ruff check blinky_server/ tests/

    - name: Check formatting
      run: venv/bin/python -m ruff format --check blinky_server/ tests/

    - name: Run type checking
      run: venv/bin/python -m mypy blinky_server/

    - name: Run tests
      run: venv/bin/python -m pytest tests/ -v

    - name: Host tools (hosttools/)
      # blinky-server's own release client and UF2 flash tool, vendored from blinky-firmware in
      # the 2026-11-24 decoupling: verbatim firmware-style code, so outside the package's
      # ruff/mypy scope, but tested here.
      run: venv/bin/python -m pytest -v hosttools/tests/

    - name: Test box deployer, hardware runners and dev loop client (scripts/testbox/)
      # They decide what the test box runs and what reaches master (#349), so they are
      # tested like the server.
      run: |
        venv/bin/python -m ruff check --line-length 100 ../scripts/testbox/
        venv/bin/python -m ruff format --check --line-length 100 ../scripts/testbox/
        venv/bin/python -m mypy --strict --ignore-missing-imports \
          ../scripts/testbox/deploy.py ../scripts/testbox/staging.py ../scripts/testbox/dev.py \
          ../scripts/testbox/pr_queue.py
        venv/bin/python -m pytest -v ../scripts/testbox/test_deploy.py ../scripts/testbox/test_staging.py \
          ../scripts/testbox/test_dev.py ../scripts/testbox/test_pr_queue.py

  testbox-camera:
    name: Test box camera analysis
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # The analysis runs on the box's system Python (numpy from apt), not the server's venv;
    # the capture helper needs the camera and is exercised on the box.
    - name: Region discovery, visual onsets and the lights worker, on synthetic data
      run: |
        pip install 'numpy>=1.26,<3' pytest
        python -m pytest -v scripts/testbox/camera/test_camera_analysis.py \
          scripts/testbox/camera/test_camera_lights.py

  feature-parity:
    # The name is a required status check: keep it. "firmware" is the contract the firmware
    # publishes (ml-training/spec/), not its source: no firmware checkout here.
    name: Feature Parity (Python ↔ firmware)
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`).
    if: ${{ github.event.pull_request.draft != true }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # The edm labels and blinky_scoring for test_drum_label_sync and the label-merge copy
    # check, at the commit this repo pins (#357).
    - name: Corpus submodule
      run: git submodule update --init --depth 1 corpus

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install numpy for unit tests
      run: pip install 'numpy>=1.26,<3' scipy pyyaml

    - name: onset_label_merge.py copies match (ml-training vs blinky-corpus)
      # Training and the server's scoring (blinky-corpus) each carry a copy; they must stay
      # byte-identical apart from the docstring. Before the split this ran in the firmware's
      # pre-compile safety script, which can't see ml-training any more (#357).
      run: python scripts/check_label_merge_sync.py

    - name: Run Python shape-feature unit tests
      # Regression guard for bin-indexing (centroid/HFC k=1..N) and the
      # resolve_hybrid_features config parser. Runs offline — no audio
      # files or harness build required. The firmware-parity side is
      # verified locally via ml-training/analysis/run_parity_test.py.
      working-directory: ml-training
      run: python -m analysis.test_shape_features

    - name: Mel parity (training front end vs the mel contract, #295)
      # The NN runs on the firmware's integer MEL_BANDS table, not an HTK filterbank. The
      # contract is ml-training/spec/mel_frontend_v1.json and its golden vectors (the
      # firmware's own mel on fixed frames); blinky-firmware carries identical copies and
      # checks its C++ against them in its CI. Here: the spec and vectors are whole (sha256),
      # training's front end (scripts/mel_frontend.py) reproduces the vectors within the
      # spec's tolerance, and configs default to the table. No firmware source.
      working-directory: ml-training
      run: python -m analysis.test_mel_parity

    - name: Mel front end travels to the model header (#291)
      # prepare_dataset.py records the front end, train.py and export_tflite.py carry it into
      # the header as the spec's version, which blinky-firmware compares with its
      # MEL_FRONTEND_VERSION (its check_model_input.py, tested there).
      working-directory: ml-training
      run: |
        pip install pytest
        python -m pytest -q tests/test_mel_frontend_record.py

    - name: Run ML storage-root, Spark client and drum-label sync tests
      # No config may hardcode a machine's mounts (#286): data and work roots
      # come from BLINKY_DATA / BLINKY_WORK. The Spark CLI (#288) is a thin
      # client of blinky-server's /api/spark routes; the client itself is
      # tested with the server (blinky-server/tests/test_spark.py).
      # blinky-server's drum scoring cleans kick_weighted labels with its own
      # copy of clean_kick_weighted.py's rule (#294); the two must agree.
      working-directory: ml-training
      run: |
        pip install pytest
        python -m pytest -q tests/test_storage_roots.py tests/test_spark_jobs.py tests/test_prep_steps.py \
          tests/test_drum_label_sync.py tests/test_supervision.py

  trainer-contract:
    # Quoted: unquoted, YAML reads ` #305)` as a comment and the check is named "...(#304,".
    name: "Trainer meets the Spark gpu_task contract (#304, #305)"
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`). Otherwise skipped unless ml changed (job
    # `changes`); runs if that job failed, so a broken diff can never skip it silently.
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.ml == 'true') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # The edm corpus and its labels (#357).
    - name: Corpus submodule
      run: git submodule update --init --depth 1 corpus

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CPU torch
      run: |
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install 'numpy>=1.26,<3' scipy pyyaml pytest librosa tqdm soundfile

    - name: SIGTERM -> exit 42 -> resume -> finish; a changed run refuses the checkpoint
      # The real train.py on a tiny synthetic dataset, with the environment the Spark's
      # gpu_task worker sets (SPARK_INPUT_DATA, SPARK_OUTPUT_MODEL, SPARK_CHECKPOINT_DIR).
      working-directory: ml-training
      run: python -m pytest -v tests/test_trainer_supervision.py

    - name: Shift-tolerant loss (#290)
      # Beat This!'s loss: firing within ±3 frames of a label is free, and no frame within ±6
      # of one is a negative.
      working-directory: ml-training
      run: python -m pytest -v tests/test_losses.py

    - name: spark_entry.py preps the corpus and trains; SIGTERM in prep exits 42
      # Real prepare_dataset.py (augmented: RIR + noise) then train.py, on an eight-track
      # synthetic corpus laid out like the store's datasets/blinky-corpus/, code read-only.
      working-directory: ml-training
      run: python -m pytest -v tests/test_spark_entry.py

    - name: Drum label regression suite and generator guards (#284)
      # The suite a kick/snare label generator must pass, its baseline, and the generator's
      # refusal to mix labels from two generators in one dir. ADTOF's own tests skip here:
      # they run in the adtof-labeler job.
      working-directory: ml-training
      run: python -m pytest -v tests/test_drum_label_suite.py

  adtof-labeler:
    name: ADTOF drum labeler (#284)
    # The labels' generator: ADTOF's Frame_RNN through the PyTorch port, pinned, as the Spark's
    # torch-cu130 runtime installs it (my-spark #1561). Its tests may not skip here, and the
    # committed evidence (drum_label_adtof.json) must be what it produces.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Heavy: skipped on a draft PR (see `on:`). Otherwise skipped unless ml changed (job
    # `changes`); runs if that job failed, so a broken diff can never skip it silently.
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.ml == 'true') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # The edm corpus and its labels (#357).
    - name: Corpus submodule
      run: git submodule update --init --depth 1 corpus

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CPU torch and the port
      working-directory: ml-training
      run: |
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install 'numpy>=1.26,<3' scipy pyyaml pytest librosa tqdm soundfile pretty_midi
        pip install "$(python -c 'from scripts.adtof_labels import ADTOF_PYTORCH; print(ADTOF_PYTORCH)')"

    - name: ADTOF's tests (no skips)
      working-directory: ml-training
      env:
        BLINKY_REQUIRE_ADTOF: "1"
      run: python -m pytest -v tests/test_drum_label_suite.py -k adtof

    - name: The committed evidence is ADTOF's
      # Re-scores ADTOF on the synthetic set and edm/'s 18 mixes. A difference means
      # drum_label_adtof.json isn't what this generator produces: commit the uploaded file.
      working-directory: ml-training
      run: |
        python scripts/drum_label_suite.py candidate --algorithm adtof
        git diff --exit-code scripts/drum_label_adtof.json

    - name: Upload the regenerated evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: drum_label_adtof
        path: ml-training/scripts/drum_label_adtof.json

  blinky-console-tests:
    name: Blinky Console Tests
    runs-on: ubuntu-latest
    # Heavy: skipped on a draft PR (see `on:`). Otherwise skipped unless console changed (job
    # `changes`); runs if that job failed, so a broken diff can never skip it silently.
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.console == 'true') }}

    defaults:
      run:
        working-directory: blinky-console

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Check formatting
      run: npm run format:check

    - name: Run type check
      run: npm run typecheck

    - name: Run tests
      run: npx vitest run

    - name: Build
      run: npm run build

  build-service:
    # docs/DEV_LOOP.md, "Build service": the unit tests, then both images built and the stack run
    # here, building a real blinky-firmware staging commit through the SHA path and a new commit
    # on top of it through the bundle path; each package must pass blinky-server's own verifier.
    # GitHub-hosted only: nothing here may run on the owner's machines.
    name: Build service
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Heavy: skipped on a draft PR (see `on:`). Otherwise skipped unless build-service changed
    # (job `changes`); runs if that job failed, so a broken diff can never skip it silently.
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.build_service == 'true') }}
    env:
      # A recent blinky-firmware staging commit (b211): the worker image bakes in its toolchain,
      # and it is the commit built end to end. Move it when the toolchain pin moves.
      FIRMWARE_SHA: c28e0a29331e6163cd590bb4c506402e2aa84545
      BLINKY_BUILD_BIND: 127.0.0.1
      BLINKY_BUILD_PORT: "18080"
      BLINKY_BUILD_API_IMAGE: blinky-build-api:ci
      BLINKY_BUILD_WORKER_IMAGE: blinky-build-worker:ci

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Lint and unit tests (trust check, bundles, auth, cache, toolchain mismatch)
      working-directory: build-service
      run: |
        pip install ruff pytest
        ruff check .
        python -m pytest -v tests

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the api image
      uses: docker/build-push-action@v6
      with:
        context: build-service
        file: build-service/docker/Dockerfile.api
        tags: ${{ env.BLINKY_BUILD_API_IMAGE }}
        load: true
        cache-from: type=gha,scope=blinky-build-api
        cache-to: type=gha,mode=max,scope=blinky-build-api

    - name: Build the worker image (the pinned toolchain baked in)
      uses: docker/build-push-action@v6
      with:
        context: build-service
        file: build-service/docker/Dockerfile.worker
        build-args: FIRMWARE_TOOLCHAIN_REF=${{ env.FIRMWARE_SHA }}
        tags: ${{ env.BLINKY_BUILD_WORKER_IMAGE }}
        load: true
        cache-from: type=gha,scope=blinky-build-worker
        cache-to: type=gha,mode=max,scope=blinky-build-worker

    - name: Start the stack
      working-directory: build-service
      run: |
        token=$(openssl rand -hex 32)
        echo "::add-mask::$token"
        # For this step and the later ones (compose interpolates both, even for logs and down).
        printf 'BLINKY_BUILD_TOKEN=%s\nFIRMWARE_TOOLCHAIN_REF=%s\n' "$token" "$FIRMWARE_SHA" >> "$GITHUB_ENV"
        export BLINKY_BUILD_TOKEN=$token FIRMWARE_TOOLCHAIN_REF=$FIRMWARE_SHA
        docker compose up -d --no-build
        deadline=$((SECONDS + 120))
        until curl -fsS "http://$BLINKY_BUILD_BIND:$BLINKY_BUILD_PORT/v1/healthz"; do
          [ $SECONDS -lt $deadline ] || { docker compose logs; exit 1; }
          sleep 2
        done

    - name: The sandbox is what the design says
      shell: bash
      run: |
        set -euo pipefail
        w=$(docker ps -q --filter label=com.docker.compose.project=blinky-build-local --filter label=com.docker.compose.service=worker)
        a=$(docker ps -q --filter label=com.docker.compose.project=blinky-build-local --filter label=com.docker.compose.service=api)
        check() { [ "$2" = "$3" ] || { echo "::error::$1: got '$2', want '$3'"; exit 1; }; echo "$1: $2"; }
        check "worker network" "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$w")" none
        check "worker user" "$(docker inspect -f '{{.Config.User}}' "$w")" 10001:10001
        check "worker cap_drop" "$(docker inspect -f '{{json .HostConfig.CapDrop}}' "$w")" '["ALL"]'
        check "worker security_opt" "$(docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$w")" '["no-new-privileges:true"]'
        check "worker docker socket" "$(docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' "$w" | grep -c docker.sock || true)" 0
        check "api user" "$(docker inspect -f '{{.Config.User}}' "$a")" 10001:10001
        check "api read-only rootfs" "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$a")" true
        check "api cap_drop" "$(docker inspect -f '{{json .HostConfig.CapDrop}}' "$a")" '["ALL"]'
        # The toolchain is root-owned: a build can't change it for the next one.
        docker exec "$w" sh -c 'touch /opt/blinky/src/.arduino/x 2>/dev/null && exit 1 || echo "toolchain: not writable"'

    - name: A blinky-firmware checkout to make bundles from
      run: |
        git clone -q https://github.com/Jdubz/blinky-firmware.git "$RUNNER_TEMP/fw"
        git -C "$RUNNER_TEMP/fw" checkout -q --detach "$FIRMWARE_SHA"

    - name: The staging build's artifact for the same commit (manifest comparison)
      id: staging
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Retained 30 days; past that (or unreadable with this token) the comparison is skipped
        # with a notice, and the verifier still runs.
        name="staging-firmware-$FIRMWARE_SHA"
        run_id=$(gh api "repos/Jdubz/blinky-firmware/actions/artifacts?name=$name" \
                   --jq '[.artifacts[] | select(.expired == false)] | max_by(.created_at) | .workflow_run.id' 2>/dev/null || true)
        if [ -n "$run_id" ] && [ "$run_id" != null ] && \
           gh run download "$run_id" -R Jdubz/blinky-firmware --name "$name" --dir "$RUNNER_TEMP/staging"; then
          echo "dir=$RUNNER_TEMP/staging" >> "$GITHUB_OUTPUT"
        else
          echo "::notice title=Build service::no readable $name artifact; manifest comparison skipped"
        fi

    - name: End to end (SHA path, bundle path, verified packages)
      # `shell: bash` is `bash -eo pipefail`: without pipefail the step would take tee's status
      # and a failed e2e would pass.
      shell: bash
      run: |
        python build-service/tests/e2e.py --url "http://$BLINKY_BUILD_BIND:$BLINKY_BUILD_PORT" \
          --sha "$FIRMWARE_SHA" --firmware "$RUNNER_TEMP/fw" --hosttools blinky-server/hosttools \
          ${{ steps.staging.outputs.dir && format('--staging-artifact {0}', steps.staging.outputs.dir) || '' }} \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Service logs
      if: always()
      working-directory: build-service
      run: |
        docker compose logs --no-color --timestamps || true
        # The build logs, from the job volume.
        docker run --rm --entrypoint sh -v blinky-build-local_jobs:/jobs:ro "$BLINKY_BUILD_API_IMAGE" \
          -c 'for f in /jobs/*/build.log; do echo "=== $f"; tail -n 80 "$f"; done' || true

    - name: Stop the stack
      if: always()
      working-directory: build-service
      run: docker compose down -v --remove-orphans || true

  labels-service:
    # labels-service/README.md: the shared-labels service, its page, the build host's deployments
    # (labels and the build service's deploy/build-host/build/) and its pull deployer. The deployer
    # requires this check green on the master commit before it deploys
    # (deploy/build-host/deployer/services.json).
    name: Labels service
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.labels_service == 'true') }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pytest
      run: pip install pytest
    - name: Service tests (state, HTTP, publisher)
      run: python -m pytest -v labels-service/tests/
    - name: The page (JS syntax, no external fetches)
      run: python labels-service/check_js.py
    - name: The build host's pull deployer and the build service's sandbox check
      run: python -m pytest -v deploy/build-host/deployer/ deploy/build-host/build/
    - name: Deploy scripts parse (shellcheck)
      run: shellcheck deploy/build-host/*/*.sh
    - name: The build service's deployment keeps the sandbox (check_config.py)
      # The same check deploy.sh runs before every deploy, on placeholder host values.
      working-directory: deploy/build-host/build
      run: |
        BLINKY_BUILD_BIND=192.0.2.10 BLINKY_BUILD_PORT=18080 BLINKY_BUILD_CPUSET=0-1 \
        BLINKY_BUILD_TOKEN=placeholder BLINKY_BUILD_SERVICE_VERSION="$(git rev-parse HEAD:build-service)" \
          docker compose --env-file /dev/null config --format json | python3 check_config.py

  labels-service-e2e:
    # The image in the production sandbox (non-root, read-only rootfs, no capabilities) against a bare
    # stand-in for GitHub, then two Chromium pages on one track from another origin. GitHub-hosted only.
    name: Labels service (container, end to end)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ always() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || needs.changes.outputs.labels_service == 'true') }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true  # the real corpus, as the stand-in for blinky-corpus
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build the image
      run: docker build --build-arg LABELS_SERVICE_VERSION="$(git rev-parse HEAD:labels-service)" -t labels-service:ci labels-service
    - name: The stand-in for blinky-corpus (a bare clone of the pinned corpus)
      run: |
        # The pinned corpus commit as `main` of a bare repo the service clones from and pushes to.
        git -C corpus fetch -q --unshallow 2>/dev/null || true
        for r in remote remote2; do
          git clone -q --bare --no-local corpus "$RUNNER_TEMP/$r.git"
          git -C "$RUNNER_TEMP/$r.git" update-ref refs/heads/main "$(git -C corpus rev-parse HEAD)"
          git -C "$RUNNER_TEMP/$r.git" config receive.shallowUpdate true
        done
        chmod -R a+rwX "$RUNNER_TEMP/remote.git"
        printf '[safe]\n\tdirectory = *\n' > "$RUNNER_TEMP/gitconfig"
    - name: Run the container
      run: |
        docker run -d --name labels --network host --read-only --tmpfs /tmp:size=64m \
          --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 512m \
          -v "$RUNNER_TEMP/remote.git:/remote" -v "$RUNNER_TEMP/gitconfig:/etc/gitconfig:ro" \
          labels-service:ci --host 127.0.0.1 --port 8766 --state /state \
          --checkout /corpus/blinky-corpus --git-url file:///remote --refresh 2 --quiet 3 \
          --allow-host api.example.invalid --cors-origin https://site.example.invalid
        test "$(docker inspect -f '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}}' labels)" = "10001:10001 true"
    - name: End to end (API)
      run: python labels-service/tests/e2e_hosted.py --api http://127.0.0.1:8766 --origin https://site.example.invalid --host api.example.invalid --remote "$RUNNER_TEMP/remote.git"
    - name: End to end (two browsers on one track)
      run: |
        pip install playwright==1.49.1
        python -m playwright install --with-deps chromium
        mkdir -p "$RUNNER_TEMP/site"
        sed 's#<meta name="drum-reviewer-api" content="">#<meta name="drum-reviewer-api" content="http://127.0.0.1:8767">#' \
          labels-service/index.html > "$RUNNER_TEMP/site/index.html"
        (cd "$RUNNER_TEMP/site" && python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/site.log" 2>&1 &)
        python labels-service/server.py --host 127.0.0.1 --port 8767 --state "$RUNNER_TEMP/state2" \
          --checkout "$RUNNER_TEMP/co2" --git-url "file://$RUNNER_TEMP/remote2.git" --refresh 2 --quiet 3 \
          --cors-origin http://127.0.0.1:8000 > "$RUNNER_TEMP/server2.log" 2>&1 &
        python labels-service/tests/browser_hosted.py --page http://127.0.0.1:8000/ --api http://127.0.0.1:8767
    - name: Logs
      if: always()
      run: |
        docker logs labels 2>&1 | grep -v '"event":"http"' | tail -n 60 || true
        tail -n 40 "$RUNNER_TEMP"/*.log || true
