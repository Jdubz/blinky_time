# Tracker studies (#340): one-off analyses on edm/ with the host harness, run in
# CI so the test box stays capture-only. Manual only; gates nothing. Results are
# in the log, the step summary and the `study` artifact.
#
#   gh workflow run tracker-study.yml -f study=pattern_bias
name: Tracker study

on:
  workflow_dispatch:
    inputs:
      study:
        description: "which study"
        type: choice
        options: [pattern_bias, frame_phase]
      fps:
        description: "simulated loop rate"
        default: "60"

permissions:
  contents: read

jobs:
  study:
    name: Tracker study (${{ inputs.study }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: pip install numpy imageio-ffmpeg

    - name: Build harness
      run: |
        mkdir -p build
        g++ -std=c++17 -O2 -DBLINKY_HOST_HARNESS -DARDUINO_ARCH_NRF52 -DBLINKY_PLATFORM_NRF52840 \
          -Iblinky-simulator/include -Iblinky-things \
          tests/tracker/tracker_harness.cpp blinky-things/audio/AudioTracker.cpp \
          blinky-things/audio/SharedSpectralAnalysis.cpp blinky-things/inputs/AdaptiveMic.cpp \
          blinky-things/types/BlinkyAssert.cpp -o build/tracker_harness

    - name: Run study
      shell: bash  # -o pipefail: a failed study fails the step through tee
      env:
        STUDY: ${{ inputs.study }}
        FPS: ${{ inputs.fps }}
      run: |
        python "tests/tracker/${STUDY}_study.py" --harness build/tracker_harness --fps "$FPS" \
          --json study.json | tee study.txt
        { echo '```'; sed -n '/^[A-Z][A-Z ]*[:(]/,$p' study.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: study
        path: |
          study.txt
          study.json
