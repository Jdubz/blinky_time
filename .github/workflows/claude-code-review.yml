name: Claude Code Review

# Ported from Josh-Wentworth/imagineer's working review workflow.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (Max subscription), as in imagineer/my-spark.
# The WORKFLOW posts a sha-stamped verdict from the model's structured output,
# rather than trusting the model to post its own comment.
#
# NOTE: claude-code-action refuses to run a workflow whose content differs from
# the default branch's copy, so a change to this file only takes effect after it
# is merged to master.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# A superseded commit's review is worthless — a new push cancels the in-flight
# review of the commit it replaced.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # a PR comment is an issue comment
      id-token: write

    steps:
      # Full history: `gh pr diff` truncates at the API's 20,000-line limit; with
      # history the model diffs against the merge base itself.
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Resolve reviewed commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Resolved here, not by the model: the tool allowlist only matches plain
      # commands, so `git diff $(git merge-base ...)` would be denied.
      - name: Resolve merge base and changed files
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          {
            echo "files<<CHANGED_FILES_EOF"
            git diff --name-status "$base" HEAD
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        # Advisory: a failed review must never red-X the PR; a failure simply
        # posts no verdict.
        continue-on-error: true
        # Subscription-only billing: blank higher-precedence Anthropic creds so a
        # stray key can't override the OAuth token (precedence:
        # ANTHROPIC_AUTH_TOKEN > ANTHROPIC_API_KEY > CLAUDE_CODE_OAUTH_TOKEN).
        env:
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          # Claude Code caps Bash output at ~30 KB and diverts the rest to a side
          # file. On PR #152 four directory-level diffs (31-75 KB) overflowed and one
          # was never read back. Raise the cap so per-file diffs come back inline.
          BASH_MAX_OUTPUT_LENGTH: "200000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action mints a GitHub App token via OIDC, which 403s.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            COMMIT UNDER REVIEW: ${{ steps.rev.outputs.sha }}
            BASE BRANCH: ${{ github.base_ref }}
            MERGE BASE: ${{ steps.diff.outputs.base }}

            The PR branch is checked out in the working directory.

            Review this pull request for:
            - bugs and incorrect logic
            - code that cannot compile or parse
            - device-safety risks (this firmware runs on sealed devices: crash loops,
              stack/heap exhaustion, watchdog starvation, broken BLE/USB recovery paths)
            - security implications
            - clear, quotable CLAUDE.md violations (only rules whose CLAUDE.md shares a
              path prefix with the file being judged)

            Read the root CLAUDE.md and any CLAUDE.md in a directory containing a changed
            file. Get the author's intent with `gh pr view`.

            CHANGED FILES (git name-status against the merge base):
            ${{ steps.diff.outputs.files }}

            THE DIFF. Every entry above that is not a deletion (D) must be read. Read the
            diff ONE FILE AT A TIME with
              `git diff ${{ steps.diff.outputs.base }} HEAD -- <path>`
            (not whole directories: large outputs get diverted to a file). If a tool
            result says "Output too large ... saved to <file>", Read that file to the END
            (offset/limit until no lines remain) before moving on. For a newly added
            file (A), Read the file itself. Do NOT rely on `gh pr diff`: it truncates at
            the API's 20,000-line limit.

            Run ONE plain command per Bash call. Pipes, `&&`, `;` and `$(...)` do not match
            the allowlist and are DENIED.

            COVERAGE. Read the diff of EVERY non-deleted entry: docs, config, tests and
            scripts included. There is NO time or turn budget — do not stop early, do not
            sample, and never cite "time" as a reason to skip. List every path whose diff
            you actually read in `files_reviewed`; the workflow checks that list against
            the changed files and reports any gap. Report `coverage: "full"` only if you did; `"partial"` when
            something prevented a read (name what and why in the summary).

            Report ONLY high-signal issues, validated against the actual code. A false
            positive is worse than a miss. Post each surviving issue as an inline comment
            with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`).

            Do NOT skip this review for any reason — not because Claude has already
            commented, not because it is Claude-authored, not because it looks trivial.

            WORK ALONE. Do not use the Task tool or spawn subagents (auto-denied in headless
            CI; a fan-out burns the run and produces no verdict).

            Do not post a top-level comment. Return the verdict as structured output —
            `verdict` ("no-issues" or "issues"), `coverage` ("full" or "partial"),
            `issue_count`, `files_reviewed` (array of paths), and a short markdown
            `summary` — and the workflow posts it,
            stamped with the sha above.
          claude_args: |
            --model claude-opus-5-5 --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(git show:*)" --json-schema '{"type":"object","required":["verdict","coverage","issue_count","files_reviewed","summary"],"additionalProperties":false,"properties":{"verdict":{"type":"string","enum":["no-issues","issues"]},"coverage":{"type":"string","enum":["full","partial"]},"issue_count":{"type":"integer","minimum":0},"files_reviewed":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}}}'

      # Posts ONLY a verdict actually received; malformed output is refused, never
      # papered over. Recovery for a crashed run: `gh run rerun <id>`.
      - name: Post the review verdict
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.rev.outputs.sha }}
          STRUCTURED: ${{ steps.claude-review.outputs.structured_output }}
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: bash scripts/post-review-verdict.sh
