# Cut a firmware release CANDIDATE (docs/RELEASE_PROCESS.md).
#
# Runs on every merge to master (#349), once PR Validation has passed on the
# master commit; also by hand (`gh workflow run release.yml --ref master`).
# The commit must be the merge of a staging head that passed the box's
# hardware test ("Hardware test (staging)" status), with the same tree.
# Builds it with the pinned toolchain, validates it with the same checks the
# deploy paths run, and publishes a GitHub PRE-release `b<N>` with hex, UF2
# and manifest.json, its notes linking the hardware report. Candidates are never
# signed for OTA: sign-release.yml signs a release only after its bench gate
# passes (dispatched by release_promote.py). A candidate reaches no
# device except listed test devices until it passes the bench gate
# (tools/release_gate.py) and is promoted (tools/release_promote.py).
name: Release candidate

on:
  workflow_dispatch:
  # workflow_run runs this file from the default branch (staging).
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and publish candidate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The master commit: the run that passed (workflow_run), or master's tip (by hand).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
    - name: Only from master
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
          echo "::error title=Release::candidates are cut from master only (got $GITHUB_REF)"
          exit 1
        fi
        st=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...master" --jq .status)
        if [ "$st" != "identical" ] && [ "$st" != "ahead" ]; then
          echo "::error title=Release::$SHA is not on master ($st)"
          exit 1
        fi

    - name: Checkout (with tags)
      uses: actions/checkout@v4
      with:
        ref: ${{ env.SHA }}
        fetch-depth: 0

    - name: One candidate per commit
      id: once
      run: |
        have=$(gh release list --limit 30 --json tagName --jq '.[].tagName' | while read -r t; do
                 [ "$(git rev-list -n 1 "$t" 2>/dev/null)" = "$SHA" ] && echo "$t"; done | head -1)
        if [ -n "$have" ]; then
          echo "$SHA already has candidate $have; nothing to do"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    # The commit must already have passed PR Validation on master: a release
    # is never the first time a commit is built and tested.
    - name: Require green CI on this commit
      if: steps.once.outputs.skip != 'true'
      run: |
        ok=$(gh run list --workflow pr-validation.yml --branch master --commit "$SHA" \
               --json status,conclusion --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
        if [ "${ok:-0}" -lt 1 ]; then
          echo "::error title=Release::no successful PR Validation run on master for $SHA - wait for CI or fix it first"
          exit 1
        fi
        echo "CI passed for $SHA"

    # And the box's hardware test (#349): a merge of a staging head with the same tree,
    # whose "Hardware test (staging)" status passed.
    - name: Require the staging hardware report
      if: steps.once.outputs.skip != 'true'
      id: hw
      run: |
        head=$(git rev-parse "$SHA^2" 2>/dev/null) || {
          echo "::error title=Release::$SHA is not a merge commit: master takes staging merges only"; exit 1; }
        if [ "$(git rev-parse "$SHA^{tree}")" != "$(git rev-parse "$head^{tree}")" ]; then
          echo "::error title=Release::$SHA's tree differs from the staging head $head it merged"; exit 1
        fi
        git merge-base --is-ancestor "$head" origin/staging || {
          echo "::error title=Release::$head is not on staging"; exit 1; }
        st=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/statuses?per_page=100" \
               --jq '[.[] | select(.context=="Hardware test (staging)")][0]')
        state=$(echo "$st" | jq -r '.state // empty')
        if [ "$state" != "success" ]; then
          echo "::error title=Release::staging head $head has no passing hardware report (${state:-none})"; exit 1
        fi
        echo "head=$head" >> "$GITHUB_OUTPUT"
        echo "url=$(echo "$st" | jq -r '.target_url // empty')" >> "$GITHUB_OUTPUT"
        echo "hardware report passed for $head"

    - name: Build number
      if: steps.once.outputs.skip != 'true'
      id: num
      run: |
        file=$(tr -d '[:space:]' < blinky-things/BUILD_NUMBER)
        tags=$(git tag -l 'b[0-9]*' | sed 's/^b//' | grep -E '^[0-9]+$' | sort -n | tail -1)
        n=$(( ${file:-0} > ${tags:-0} ? ${file:-0} : ${tags:-0} ))
        n=$((n + 1))
        # Notes compare against the STABLE release devices actually run
        # (GitHub's Latest, promoted with stable-b<N>), not the newest bN
        # tag, which may be a candidate that failed its gate.
        prev=$(gh release list --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName' | head -1)
        if [ -n "$prev" ] && ! git rev-parse -q --verify "refs/tags/stable-$prev" >/dev/null; then
          echo "::error title=Release::Latest release $prev has no stable-$prev tag; fix the release state first"
          exit 1
        fi
        echo "build=$n" >> "$GITHUB_OUTPUT"
        echo "prev=$prev" >> "$GITHUB_OUTPUT"
        echo "Release build b$n (BUILD_NUMBER file $file, highest tag ${tags:-none})"

    - name: Setup Arduino CLI
      if: steps.once.outputs.skip != 'true'
      uses: arduino/setup-arduino-cli@v2
      with:
        version: 1.3.1   # = tools/firmware_toolchain.json arduino_cli

    - name: Setup Python
      if: steps.once.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pinned toolchain
      if: steps.once.outputs.skip != 'true'
      run: |
        pip install adafruit-nrfutil pyserial
        bash scripts/setup_toolchain.sh

    - name: Build firmware
      if: steps.once.outputs.skip != 'true'
      run: bash scripts/build.sh --build ${{ steps.num.outputs.build }}

    - name: Package and validate
      if: steps.once.outputs.skip != 'true'
      run: |
        TFLITE_REF=$(sed -n 's/^TFLITE_REF="${TFLITE_REF:-\([0-9a-f]*\)}"$/\1/p' tools/setup_tflite_lib.sh)
        [ -n "$TFLITE_REF" ] || { echo "::error::TFLITE_REF pin not found in setup_tflite_lib.sh"; exit 1; }
        TC=$(jq -c --arg tflite "$TFLITE_REF" --arg cli "$(arduino-cli version | head -1)" \
               '{core: .core, libraries: .libraries, fqbn: .fqbn, tflite_ref: $tflite, arduino_cli: $cli}' \
               tools/firmware_toolchain.json)
        python tools/firmware_release.py package \
          --hex /tmp/blinky-build/blinky-things.ino.hex \
          --build ${{ steps.num.outputs.build }} --sha "$SHA" \
          --out dist --toolchain-json "$TC" \
          --libraries-json /tmp/blinky-build/libraries.json
        ls -la dist

    - name: Release notes
      if: steps.once.outputs.skip != 'true'
      run: |
        N=${{ steps.num.outputs.build }}
        PREV=${{ steps.num.outputs.prev }}
        {
          echo "**Candidate** - not for fleet or new devices until it passes the bench gate and is promoted (docs/RELEASE_PROCESS.md)."
          echo
          echo "Commit: \`$SHA\`"
          echo
          echo "Hardware test (staging) passed on \`${{ steps.hw.outputs.head }}\`: ${{ steps.hw.outputs.url }}"
          echo
          if [ -n "$PREV" ]; then
            old=$(git show "$PREV:blinky-things/config/ConfigStorage.h" | grep -oE 'SETTINGS_VERSION = [0-9]+' | grep -oE '[0-9]+')
            new=$(grep -oE 'SETTINGS_VERSION = [0-9]+' blinky-things/config/ConfigStorage.h | grep -oE '[0-9]+')
            if [ "$old" != "$new" ]; then
              echo "> **SETTINGS_VERSION $old -> $new:** saved tuning resets to defaults on every device that installs this."
              echo
            fi
            echo "### Changes since $PREV (current stable)"
            git log --first-parent --format='- %s (%h)' "$PREV..$SHA"
          else
            echo "First release (no stable release yet)."
          fi
        } > notes.md
        cat notes.md

    - name: Publish pre-release
      if: steps.once.outputs.skip != 'true'
      run: |
        N=${{ steps.num.outputs.build }}
        gh release create "b$N" dist/* --prerelease --target "$SHA" \
          --title "b$N (candidate)" --notes-file notes.md
