name: Deploy Blinky Console

# The console also serves the web flasher's firmware: every build mirrors the
# newest stable GitHub releases into public/firmware/ (tools/firmware_release.py
# mirror). So the site redeploys when the set of stable releases changes too:
#   - promotion: release_promote.py pushes the stable-b<N> tag (push: tags),
#     then un-marks the pre-release and marks it Latest (`released`/`edited`).
#     That second run sees the release as stable; the tag-push run still
#     mirrors the previous stable as Latest, so `latest` is never null.
#   - rollback: release_promote.py --rollback re-marks Latest (`edited`).
#   - deletion of a release (`deleted`).
on:
  push:
    branches: [master]
    tags: ['stable-b*']
    paths:
      - 'blinky-console/**'
      - 'tools/firmware_release.py'
      - '.github/workflows/blinky-console-deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'blinky-console/**'
      - 'tools/firmware_release.py'
      - '.github/workflows/blinky-console-deploy.yml'
  release:
    types: [released, edited, deleted]
  workflow_dispatch:

# Deploys must not interleave: an older run finishing last would publish a
# stale firmware mirror.
concurrency:
  group: blinky-console-deploy-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: blinky-console

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      # Release and tag events carry the tagged (possibly old) commit; the live
      # site is always built from master.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || github.ref_type == 'tag') && 'master' || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror stable firmware releases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/firmware_release.py mirror --out blinky-console/public/firmware --keep 5

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build:firebase

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: static-sites-257923
          entryPoint: blinky-console
          target: blinky-time

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror stable firmware releases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/firmware_release.py mirror --out blinky-console/public/firmware --keep 5

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Build
        run: npm run build:firebase

      - name: Deploy Preview to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: static-sites-257923
          entryPoint: blinky-console
          target: blinky-time
