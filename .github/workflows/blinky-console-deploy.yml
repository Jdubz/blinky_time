name: Deploy Blinky Console

# The site also serves the drum-label reviewer at /labels/: blinky-corpus's tools/drum-reviewer page,
# from the corpus commit this repo pins (scripts/vendor-labels-page.js), talking to the hosted labels
# API (its public URL below; CORS there allows only this site's origin, so PR preview channels can show
# the page but not use it).
#
# The console also serves the web flasher's firmware: every build mirrors the
# newest stable releases of Jdubz/blinky-firmware into public/firmware/
# (blinky-server/hosttools/firmware_release.py mirror, through the GitHub API; this
# repo has no firmware checkout). Releases live in that repo, so
# their events can't trigger this one:
#   - promotion and rollback: blinky-firmware's release_promote.py dispatches
#     this workflow (gh workflow run -R Jdubz/blinky_time);
#   - a daily run catches anything else (a release deleted by hand);
#   - after deleting a release, `gh workflow run blinky-console-deploy.yml -R Jdubz/blinky_time`.
on:
  push:
    branches: [master]
    paths:
      - 'blinky-console/**'
      - 'blinky-server/hosttools/firmware_release.py'
      - '.github/workflows/blinky-console-deploy.yml'
      - 'corpus'  # the pin the /labels/ page comes from
  pull_request:
    branches: [master]
    paths:
      - 'blinky-console/**'
      - 'blinky-server/hosttools/firmware_release.py'
      - '.github/workflows/blinky-console-deploy.yml'
      - 'corpus'  # the pin the /labels/ page comes from
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# Deploys must not interleave: an older run finishing last would publish a
# stale firmware mirror.
concurrency:
  group: blinky-console-deploy-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: blinky-console

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror stable firmware releases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLINKY_FIRMWARE_REPO: Jdubz/blinky-firmware
        run: python3 blinky-server/hosttools/firmware_release.py mirror --out "$GITHUB_WORKSPACE/blinky-console/public/firmware" --keep 5

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Run tests
        run: npm run test:ci

      - name: Drum-label reviewer page (/labels/)
        env:
          LABELS_API_URL: https://blinky-labels-api.joshwentworth.com
        run: node scripts/vendor-labels-page.js

      - name: Build
        env:
          # The browser updater (#firmware) is live: blinky-firmware's docs/WEB_FLASHER.md. Set
          # anything else here to hide it again (kill switch).
          VITE_FIRMWARE_UPDATES: 'on'
        run: npm run build:firebase

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: static-sites-257923
          entryPoint: blinky-console
          target: blinky-time

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror stable firmware releases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLINKY_FIRMWARE_REPO: Jdubz/blinky-firmware
        run: python3 blinky-server/hosttools/firmware_release.py mirror --out "$GITHUB_WORKSPACE/blinky-console/public/firmware" --keep 5

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Drum-label reviewer page (/labels/)
        env:
          LABELS_API_URL: https://blinky-labels-api.joshwentworth.com
        run: node scripts/vendor-labels-page.js

      - name: Build
        env:
          # The browser updater (#firmware) is live: blinky-firmware's docs/WEB_FLASHER.md. Set
          # anything else here to hide it again (kill switch).
          VITE_FIRMWARE_UPDATES: 'on'
        run: npm run build:firebase

      - name: Deploy Preview to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: static-sites-257923
          entryPoint: blinky-console
          target: blinky-time
