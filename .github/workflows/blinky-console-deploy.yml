name: Deploy Blinky Console

# The console also serves the web flasher's firmware: every build mirrors the
# newest stable releases of Jdubz/blinky-firmware into public/firmware/
# (firmware/tools/firmware_release.py mirror, through the firmware/ submodule,
# #357). Releases live in that repo now, so their events can't trigger this one:
#   - promotion and rollback: blinky-firmware's release_promote.py dispatches
#     this workflow (gh workflow run -R Jdubz/blinky_time);
#   - a daily run catches anything else (a release deleted by hand);
#   - after deleting a release, `gh workflow run blinky-console-deploy.yml -R Jdubz/blinky_time`.
on:
  push:
    branches: [master]
    paths:
      - 'blinky-console/**'
      - 'firmware'
      - '.github/workflows/blinky-console-deploy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'blinky-console/**'
      - 'firmware'
      - '.github/workflows/blinky-console-deploy.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# Deploys must not interleave: an older run finishing last would publish a
# stale firmware mirror.
concurrency:
  group: blinky-console-deploy-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: blinky-console

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v5

      # The release client (firmware_release.py mirror), at the commit blinky_time pins.
      - name: Firmware submodule
        working-directory: .
        run: git submodule update --init --depth 1 firmware

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror stable firmware releases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 firmware/tools/firmware_release.py mirror --out "$GITHUB_WORKSPACE/blinky-console/public/firmware" --keep 5

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Run tests
        run: npm run test:ci

      - name: Build
        env:
          # The browser updater (#firmware) is live: blinky-firmware's docs/WEB_FLASHER.md. Set
          # anything else here to hide it again (kill switch).
          VITE_FIRMWARE_UPDATES: 'on'
        run: npm run build:firebase

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: static-sites-257923
          entryPoint: blinky-console
          target: blinky-time

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Firmware submodule
        working-directory: .
        run: git submodule update --init --depth 1 firmware

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror stable firmware releases
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 firmware/tools/firmware_release.py mirror --out "$GITHUB_WORKSPACE/blinky-console/public/firmware" --keep 5

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Build
        env:
          # The browser updater (#firmware) is live: blinky-firmware's docs/WEB_FLASHER.md. Set
          # anything else here to hide it again (kill switch).
          VITE_FIRMWARE_UPDATES: 'on'
        run: npm run build:firebase

      - name: Deploy Preview to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: static-sites-257923
          entryPoint: blinky-console
          target: blinky-time
